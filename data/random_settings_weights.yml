---
default_progression:
  name: Default (Progression)
  display_order: 1
  description: >
    Randomize all progression settings, with classic weights from RSL season 1.<br>
    Convenience tweaks, difficulty settings and number of hints are not randomized, 
    letting you customize for an easier or harder experience
  weights:
    - name: dungeons_combo
      tree:
        root:
          name: progression_dungeons
          weight: 80%
        branches:
          true:
            combo: [required_bosses, boss_soul_shuffle]
            choices:
              !!python/tuple [required_bosses, boss_soul_shuffle]: 63%
              !!python/tuple [required_bosses]: 27%
              !!python/tuple []: 10%
          false:
            combo: [required_bosses, boss_soul_shuffle]
            choices:
              !!python/tuple []: 1
    - name: progression_great_fairies
      weight: 50%
    - name: progression_puzzle_secret_caves
      weight: 50%
    - name: progression_combat_secret_caves
      weight: 50%
    - name: progression_short_sidequests
      weight: 50%
    - name: progression_long_sidequests
      weight: 20%
    - name: progression_spoils_trading
      weight: 10%
    - name: progression_minigames
      weight: 50%
    - name: progression_free_gifts
      weight: 80%
    - name: progression_mail
      weight: 50%
    - name: progression_platforms_rafts
      weight: 50%
    - name: progression_submarines
      weight: 50%
    - name: progression_eye_reef_chests
      weight: 50%
    - name: progression_big_octos_gunboats
      weight: 50%
    - name: progression_triforce_charts
      weight: 20%
    - name: progression_treasure_charts
      weight: 5%
    - name: progression_expensive_purchases
      weight: 20%
    - name: progression_misc
      weight: 50%
    - name: progression_tingle_chests
      weight: 50%
    - name: progression_battlesquid
      weight: 20%
    - name: progression_savage_labyrinth
      weight: 35%
    - name: progression_island_puzzles
      weight: 50%
    - name: progression_dungeon_secrets
      weight: 50%

    # Replaces the old keylunacy toggle. Rolled as one combo so keys stay correlated,
    # preserving the original 40% odds.
    # Maps and compasses were also governed by keylunacy, but are pinned to Start With here
    # instead, so they are never shuffled on this preset.
    - name: keylunacy
      combo: [shuffle_small_keys, shuffle_big_keys]
      choices:
        - !!python/tuple [{ shuffle_small_keys: Anywhere, shuffle_big_keys: Anywhere }, 40%]
        - !!python/tuple [{ shuffle_small_keys: Own Dungeon, shuffle_big_keys: Own Dungeon }, 60%]
    - name: shuffle_maps_and_compasses
      choices:
        Start With: 1
    - name: progression_rupee_dungeon
      weight: 60%
    - name: progression_rupee_overworld
      weight: 50%
    - name: progression_blue_chu_jellies
      weight: 70%
    - name: progression_orca_minigame
      weight: 0
    - name: open_drc
      weight: 50%
    - name: randomize_dungeon_entrances
      weight: 50%
    - name: randomize_secret_cave_entrances
      weight: 30%
    - name: randomize_secret_cave_inner_entrances
      weight: 50%
    - name: randomize_boss_entrances
      weight: 50%
    - name: randomize_miniboss_entrances
      weight: 50%
    - name: randomize_fairy_fountain_entrances
      weight: 50%
    - name: mix_entrances
      choices:
        "Separate Dungeons From Caves & Fountains": 3/4
        "Mix Dungeons & Caves & Fountains": 1/4
    - name: randomize_starting_island
      weight: 100%
    - name: chest_type_matches_contents
      weight: 100%

    - name: prioritize_remote_hints
      weight: 100%
    - name: num_starting_triforce_shards
      choices:
        0: 60%
        1: 9%
        2: 8%
        3: 8%
        4: 5%
        5: 5%
        6: 2%
        7: 2%
        8: 1%
    - name: sword_mode
      choices:
        "Start with Hero's Sword": 60%
        "No Starting Sword": 40%
    - name: num_required_bosses
      choices:
        1: 5%
        2: 15%
        3: 25%
        4: 30%
        5: 15%
        6: 10%

    - name: trap_chests
      weight: 50%
    # hoho_hints is deliberately absent: it is mutually exclusive with hoho_hint_shards
    # (Options.validate silently forces the latter off), so its old 10% slice went to stone tablets.
    - name: hint_placement
      combo: ["fishmen_hints", "korl_hints", "stone_tablet_hints"]
      choices:
        !!python/tuple ["korl_hints"]: 80%
        !!python/tuple ["stone_tablet_hints"]: 20%
    # Exactly one extra hint type per seed.
    - name: extra_hint_types
      combo: [hoho_hint_shards, korl_hints_swords, kreeb_hints_bows]
      choices:
        !!python/tuple [hoho_hint_shards]: 25%
        !!python/tuple [korl_hints_swords]: 25%
        !!python/tuple [kreeb_hints_bows]: 50%
    - name: hint_importance
      weight: 100%
    - name: num_extra_starting_items
      choices:
        0: 25%
        1: 40%
        2: 25%
        3: 10%
    # When starting_gear is randomized, randomized_gear is also managed by the settings randomizer
    # and cannot be set by the user anymore
    - name: randomized_gear
      disable:
      managed: true
    - name: starting_gear
      indiv_weights:
        - !!python/tuple [["Telescope", "Ballad of Gales", "Song of Passing"], "100%"]
        - !!python/tuple [!!python/name:logic.item_types.DUNGEON_NONPROGRESS_ITEMS , "80%"]

default_both:
  name: Default (Progression & Difficulty)
  description: >
    The classic RSL experience, updated with new difficulty settings and a bit more challenge
  inherit:
    - default_progression
  weights:
    - name: randomize_starting_island
      weight: 1
    - name: randomize_charts
      weight: 50%
    - name: cryptic_hints
      weight: 40%
    - name: add_shortcut_warps_between_dungeons
      weight: 80%
    - name: starting_pohs
      choices:
        0: 48%
        1: 10%
        2: 20%
        3: 10%
        4: 5%
        5: 5%
        6: 2%
    - name: starting_hcs
      choices:
        1: 5%
        2: 8%
        3: 50%
        4: 20%
        6: 12%
        9: 5%
    - name: trap_chests
      weight: 50%
    - name: prioritize_remote_hints
      weight: 1
    - name: num_path_hints
      choices:
        6: 100%
    - name: num_barren_hints
      choices:
        6: 100%
    - name: num_location_hints
      choices:
        8: 100%
    - name: num_item_hints
      choices:
        0: 100%
    - name: sword_mode
      choices:
        Start with Hero's Sword: 60%
        No Starting Sword: 35%
        Swordless: 5%
    - name: hero_mode
      weight: 2%
    # Override how progression_dungeons is chosen in progression+difficulty randomizer
    # to enforce the RSL rule that skip_rematch_bosses is always on if progression_dungeons is on
    - name: skip_rematch_bosses
      disable:
    - name: dungeons_combo
      tree:
        root:
          name: progression_dungeons
          weight: 80%
        branches:
          true:
            combo: [required_bosses, skip_rematch_bosses, boss_soul_shuffle, prioritize_required_bosses]
            choices:
              !!python/tuple [required_bosses, skip_rematch_bosses, boss_soul_shuffle]: 63%
              !!python/tuple [required_bosses, skip_rematch_bosses, prioritize_required_bosses]: 27%
              !!python/tuple [skip_rematch_bosses]: 10%
          false:
            combo: [required_bosses, skip_rematch_bosses, boss_soul_shuffle, prioritize_required_bosses]
            choices:
              !!python/tuple [skip_rematch_bosses]: 75%
              !!python/tuple []: 25%
    - name: randomized_gear
      disable:
      managed: true
    - name: starting_gear
      min_combo: 2
      indiv_weights:
        - !!python/tuple [[Telescope], 99%]
        - !!python/tuple [[Ballad of Gales], 99%]
        - !!python/tuple [[Song of Passing], 95%]
        - !!python/tuple [!!python/name:logic.item_types.DUNGEON_NONPROGRESS_ITEMS , 80%]
    - name: always_double_magic
      weight: 70%
    - name: totg_tablet_from_start
      weight: 10%
    # One roll for the whole set: 70% start one item short of every trade threshold.
    # Boko Baba Seeds and Red Chu Jelly have no trade, so they stay at 0.
    - name: starting_spoils
      combo:
        - starting_knights_crest
        - starting_green_chu_jelly
        - starting_blue_chu_jelly
        - starting_skull_necklace
        - starting_golden_feather
        - starting_joy_pendant
        - starting_boko_baba_seed
        - starting_red_chu_jelly
      choices:
        - !!python/tuple [
            {
              starting_knights_crest: 9,
              starting_green_chu_jelly: 14,
              starting_blue_chu_jelly: 14,
              starting_skull_necklace: 19,
              starting_golden_feather: 19,
              starting_joy_pendant: 20,
              starting_boko_baba_seed: 0,
              starting_red_chu_jelly: 0,
            }, 70%]
        - !!python/tuple [
            {
              starting_knights_crest: 0,
              starting_green_chu_jelly: 0,
              starting_blue_chu_jelly: 0,
              starting_skull_necklace: 0,
              starting_golden_feather: 0,
              starting_joy_pendant: 0,
              starting_boko_baba_seed: 0,
              starting_red_chu_jelly: 0,
            }, 30%]

