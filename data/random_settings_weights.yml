pairings:
  name: Pairings
  display_order: 100 # At the end
  description: >
    All progression options have companions! In each pair, exactly one is enabled, the other disabled
  weights:
    - name: chest_type_matches_contents
      weight: 100%
    - name: hopefully dungeons
      tree:
        root:
          combo: [progression_dungeons, progression_treasure_charts]
          choices:
            !!python/tuple [progression_dungeons]: 90%
            !!python/tuple [progression_treasure_charts]: 10%
        branches:
          !!python/tuple [progression_dungeons]:
              # boss_soul_shuffle / prioritize_required_bosses are paired 50/50, but only
              # reachable on the dungeons branch — souls never shuffle without progression_dungeons.
              name: bosses + shards + 2 = 8
              combo: [required_bosses, num_required_bosses, num_starting_triforce_shards, boss_soul_shuffle, prioritize_required_bosses]
              choices:
                - !!python/tuple [{ required_bosses: False, num_required_bosses: 0, num_starting_triforce_shards: 6, boss_soul_shuffle: True, prioritize_required_bosses: False }, 2/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 1, num_starting_triforce_shards: 5, boss_soul_shuffle: True, prioritize_required_bosses: False }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 1, num_starting_triforce_shards: 5, boss_soul_shuffle: False, prioritize_required_bosses: True }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 2, num_starting_triforce_shards: 4, boss_soul_shuffle: True, prioritize_required_bosses: False }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 2, num_starting_triforce_shards: 4, boss_soul_shuffle: False, prioritize_required_bosses: True }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 3, num_starting_triforce_shards: 3, boss_soul_shuffle: True, prioritize_required_bosses: False }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 3, num_starting_triforce_shards: 3, boss_soul_shuffle: False, prioritize_required_bosses: True }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 4, num_starting_triforce_shards: 2, boss_soul_shuffle: True, prioritize_required_bosses: False }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 4, num_starting_triforce_shards: 2, boss_soul_shuffle: False, prioritize_required_bosses: True }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 5, num_starting_triforce_shards: 1, boss_soul_shuffle: True, prioritize_required_bosses: False }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 5, num_starting_triforce_shards: 1, boss_soul_shuffle: False, prioritize_required_bosses: True }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 6, num_starting_triforce_shards: 0, boss_soul_shuffle: True, prioritize_required_bosses: False }, 1/14]
                - !!python/tuple [{ required_bosses: True, num_required_bosses: 6, num_starting_triforce_shards: 0, boss_soul_shuffle: False, prioritize_required_bosses: True }, 1/14]
          !!python/tuple [progression_treasure_charts]:
              combo: [required_bosses, num_required_bosses, num_starting_triforce_shards, boss_soul_shuffle, prioritize_required_bosses]
              choices:
                - !!python/tuple [{ required_bosses: False, num_required_bosses: 0, num_starting_triforce_shards: 6, boss_soul_shuffle: False, prioritize_required_bosses: False }, 1]
    - name: optional_inner_dungeon
      combo: [progression_dungeon_secrets, progression_tingle_chests]
      choices:
        !!python/tuple [progression_dungeon_secrets]: 50%
        !!python/tuple [progression_tingle_chests]: 50%
    - name: caves
      combo: [progression_puzzle_secret_caves, progression_combat_secret_caves]
      choices:
        !!python/tuple [progression_puzzle_secret_caves]: 50%
        !!python/tuple [progression_combat_secret_caves]: 50%
    - name: island_freestanding
      combo: [progression_island_puzzles, progression_misc]
      choices:
        !!python/tuple [progression_island_puzzles]: 50%
        !!python/tuple [progression_misc]: 50%
    - name: sidequests
      combo: [progression_short_sidequests, progression_long_sidequests]
      choices:
        !!python/tuple [progression_short_sidequests]: 3/4
        !!python/tuple [progression_long_sidequests]: 1/4
    - name: you'll need a wallet
      combo: [progression_expensive_purchases, progression_triforce_charts]
      choices:
        !!python/tuple [progression_expensive_purchases]: 60%
        !!python/tuple [progression_triforce_charts]: 40%
    - name: the squids
      combo: [progression_battlesquid, progression_big_octos_gunboats]
      choices:
        !!python/tuple [progression_battlesquid]: 50%
        !!python/tuple [progression_big_octos_gunboats]: 50%
    - name: savage or start without sword
      combo: [progression_savage_labyrinth, sword_mode]
      choices:
        - !!python/tuple [{ progression_savage_labyrinth: True, sword_mode: "Start with Hero's Sword" }, 60%]
        - !!python/tuple [{ progression_savage_labyrinth: False, sword_mode: "No Starting Sword" }, 40%]
    - name: reef-rafts
      combo: [progression_platforms_rafts, progression_eye_reef_chests]
      choices:
        !!python/tuple [progression_platforms_rafts]: 50%
        !!python/tuple [progression_eye_reef_chests]: 50%
    - name: the mail minigame
      combo: [progression_mail, progression_minigames]
      choices:
        !!python/tuple [progression_mail]: 50%
        !!python/tuple [progression_minigames]: 50%
    - name: do you know the fairy colors?
      combo: [progression_great_fairies, randomize_fairy_fountain_entrances]
      choices:
        !!python/tuple [progression_great_fairies]: 60%
        !!python/tuple [randomize_fairy_fountain_entrances]: 40%
    - name: don't look a gifted spoil in the mouth
      combo: [progression_free_gifts, progression_spoils_trading]
      choices:
        !!python/tuple [progression_free_gifts]: 80%
        !!python/tuple [progression_spoils_trading]: 20%
    - name: trapped subs
      combo: [progression_submarines, trap_chests]
      choices:
        !!python/tuple [progression_submarines]: 50%
        !!python/tuple [trap_chests]: 50%
    - combo: [randomize_boss_entrances, skip_rematch_bosses]
      choices:
        !!python/tuple [randomize_boss_entrances, skip_rematch_bosses]: 75%
        !!python/tuple []: 25%
    - combo: [mix_entrances, add_shortcut_warps_between_dungeons]
      choices:
        - !!python/tuple [{ mix_entrances: Separate Dungeons From Caves & Fountains, add_shortcut_warps_between_dungeons: False }, 50%]
        - !!python/tuple [{ mix_entrances: Mix Dungeons & Caves & Fountains, add_shortcut_warps_between_dungeons: True }, 50%]
    # The bool-shorthand form can't express enums, so this pairing is spelled out explicitly.
    - name: keys or dungeon entrances
      combo: [shuffle_small_keys, shuffle_big_keys, randomize_dungeon_entrances]
      choices:
        - !!python/tuple [{ shuffle_small_keys: Anywhere, shuffle_big_keys: Anywhere, randomize_dungeon_entrances: False }, 50%]
        - !!python/tuple [{ shuffle_small_keys: Own Dungeon, shuffle_big_keys: Own Dungeon, randomize_dungeon_entrances: True }, 50%]
    - name: shuffle_maps_and_compasses
      choices:
        Start With: 1
    - name: rupees
      combo: [progression_rupee_dungeon, progression_rupee_overworld]
      choices:
        !!python/tuple [progression_rupee_dungeon]: 50%
        !!python/tuple [progression_rupee_overworld]: 50%
    - name: chus or orca
      combo: [progression_blue_chu_jellies, progression_orca_minigame]
      choices:
        !!python/tuple [progression_blue_chu_jellies]: 80%
        !!python/tuple [progression_orca_minigame]: 20%
    - name: hint_importance
      weight: 100%
    - name: kreeb_hints_bows
      weight: 100%
    - name: shard or sword hints
      combo: [hoho_hint_shards, korl_hints_swords]
      choices:
        !!python/tuple [hoho_hint_shards]: 50%
        !!python/tuple [korl_hints_swords]: 50%
    - name: whatever's left
      tree:
        root:
          name: num_extra_starting_items
          choices:
            0: 40%
            1: 30%
            2: 20%
            3: 10%
        branches:
          3:
            combo:
              [randomize_miniboss_entrances, randomize_secret_cave_entrances, randomize_secret_cave_inner_entrances]
            choices:
              !!python/tuple [randomize_miniboss_entrances, randomize_secret_cave_entrances, randomize_secret_cave_inner_entrances]: 1
          2:
            combo:
              [randomize_miniboss_entrances, randomize_secret_cave_entrances, randomize_secret_cave_inner_entrances]
